# Two environments, safe-by-default:
#
#   npx wrangler deploy                    → STAGING (zombiefarm-server-staging)
#   npx wrangler deploy --env production   → PROD    (zombiefarm-server)
#
# The TOP LEVEL of this file is the staging/default environment, so every bare
# wrangler command (deploy, dev, d1 …) targets the disposable staging stack.
# Production config lives in [env.production] at the bottom and is only reachable
# with an explicit `--env production` — that flag IS the extra step guarding prod.
# Prefer `npm run deploy` / `npm run deploy:prod`; the latter runs the full check
# suite (migrations:check, catalogs:check, typecheck, unit + integration tests) before deploying.
#
# NOTE: named environments inherit almost nothing — vars, d1_databases, and
# unsafe.bindings must be declared in BOTH places. A binding added only at the
# top level silently does not exist in production, and vice versa.

name = "zombiefarm-server-staging"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs. Without this there is no per-route CPU attribution at all — the GraphQL
# analytics API reports CPU per SCRIPT, so a rising cost/request (5.16 -> 9.75 CPU-ms
# across beta) can be measured but never explained. CPU is the first allowance the $5
# plan exhausts, so that blind spot is the one worth closing before a release.
#
# head_sampling_rate = 1 logs every request. That is the point during a launch; drop it
# to ~0.1 once the picture is clear. Budget: 20M log events/month included on Workers
# Paid, then $0.60/M. At beta volume (~2.4M requests/month) invocation logs plus the
# existing slog() calls land well inside that; re-check if traffic passes ~5x beta.
#
# NOTE: repeated verbatim under [env.production.observability] below. Named environments
# inherit almost nothing, so a block written only here does not exist in production.
[observability]
enabled = true
head_sampling_rate = 1

# ---- STAGING (default) -----------------------------------------------------
# A fully separate Worker + D1 database for testing server features without
# touching prod. Config mirrors prod except: DEV_AUTH=1 (no-Google sign-in —
# this flag must NEVER appear in the production [vars] below) and
# ALLOWED_ORIGIN=localhost:5173 so a local `npm run dev` client can call it
# (set VITE_API_URL in .env.local).
#
# Migrations:  npx wrangler d1 migrations apply zombiefarm-staging --remote
# Secrets:     npx wrangler secret put SESSION_SECRET
#              npx wrangler secret put DEV_AUTH_KEY   (staging is on the public
#              internet: every dev sign-in and /dev/* call must present this key,
#              and with DEV_AUTH_REQUIRE_KEY=1 a missing secret refuses them all)
# The staging DB was initialized via the fresh path (schema.sql + baseline
# ledger — see migrations/README.md); its data is disposable.

[[d1_databases]]
binding = "DB"
database_name = "zombiefarm-staging"
database_id = "2ee97121-08c8-4f03-ad96-84295c33484b"
migrations_dir = "migrations"

[vars]
GOOGLE_CLIENT_ID = "249211577622-cmqa6so9re0hgh2lti4mpe40nlcm3l4k.apps.googleusercontent.com"
ALLOWED_ORIGIN = "http://localhost:5173"
DEV_AUTH = "1"
DEV_AUTH_REQUIRE_KEY = "1"
MIN_PROTOCOL_VERSION = "3"
MUTATIONS_DISABLED = "0"
BLACK_MARKET_ENABLED = "1"
# Friend invasions: ON for the staging test stack (interface rework of 2026-08-23).
# This is now the ONE launch switch: the client's Invasions surfaces follow it via
# the bootstrap's `pvpEnabled` capability — see docs/FRIEND_INVASIONS.md.
PVP_ENABLED = "1"
# Which defense a friend invasion fights: "classic" (the shipped wave out of the barn
# doorway) or "formation" (one zombie per class, each with a job and a station -- see
# docs/PVP_DEFENSE_FORMATION.md). Exactly ONE is reachable in game at a time; the Worker
# authors the pinned config to match, so switching needs no client redeploy.
PVP_DEFENSE_MODE = "formation"
WRITER_LEASE_MODE = "enforce"
# Endless Mode: ON for staging testing. The client's Endless card follows the bootstrap's
# `endlessEnabled` capability, so this var is the ONE launch switch (prod: see below).
ENDLESS_ENABLED = "1"
USAGE_BREAKER_MODE = "off"

# One limiter per per-minute LIMIT: a route declared as rateLimit(..., 30, ...) in
# src/index.ts uses RL_30, so the number in the code is the number enforced. Every
# limit the code uses needs a binding here AND under [env.production] —
# test/rateLimitBindings.test.ts fails otherwise. Staging ids are 2001-2008, prod
# 1001-1008: ratelimit namespaces are account-scoped, so sharing ids would share
# throttle buckets across environments. `period` must be 10 or 60 (seconds). If a
# binding is missing the server falls back to a D1 counter at the same limit.
[[unsafe.bindings]]
name = "RL_5"
type = "ratelimit"
namespace_id = "2004"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_10"
type = "ratelimit"
namespace_id = "2005"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_20"
type = "ratelimit"
namespace_id = "2006"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_30"
type = "ratelimit"
namespace_id = "2007"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_60"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_120"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_180"
type = "ratelimit"
namespace_id = "2008"
simple = { limit = 180, period = 60 }

[[unsafe.bindings]]
name = "RL_300"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 300, period = 60 }

# Same daily cleanup sweep as prod, on staging's own database. The hourly cron runs
# the usage breaker, which staging keeps OFF: it reads the whole ACCOUNT's usage, so
# production's copy already covers staging. The Monday 06:07 one is the weekly oversight
# report (src/oversightReport.ts); staging has no email binding, so it only logs counts.
[triggers]
crons = ["17 3 * * *", "47 * * * *", "7 6 * * 1"]

# ---- PRODUCTION (--env production only) ------------------------------------
# Deploy:      npx wrangler deploy --env production   (or `npm run deploy:prod`)
# Migrations:  npx wrangler d1 migrations apply zombiefarm --remote --env production
#              See migrations/README.md for the fresh-vs-upgrade paths and the
#              non-idempotent ALTER caveats — rehearse upgrades on a prod snapshot;
#              staging was built fresh, so it does not prove the upgrade path.
# Secrets:     npx wrangler secret put SESSION_SECRET --env production
#              (SESSION_SECRET signs our own session JWTs; set out-of-band,
#              never committed. Local dev uses a git-ignored .dev.vars instead.)

[env.production]
name = "zombiefarm-server"

# The twin of [observability] at the top of this file — see the reasoning there. It has
# to be repeated because named environments do not inherit it, and the environment this
# one matters most for is production.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.d1_databases]]
binding = "DB"
database_name = "zombiefarm"
database_id = "bf1b288f-7419-41d5-8ee6-0f022c17fd20"
migrations_dir = "migrations"

# GOOGLE_CLIENT_ID is your OAuth 2.0 Web client id (safe to expose).
# ALLOWED_ORIGIN is the site allowed to call this API (your Pages origin).
# DEV_AUTH=1 enables the no-Google dev sign-in path — MUST stay unset/0 in prod.
[env.production.vars]
GOOGLE_CLIENT_ID = "249211577622-cmqa6so9re0hgh2lti4mpe40nlcm3l4k.apps.googleusercontent.com"
ALLOWED_ORIGIN = "https://zombiefarmreforged.com"
DEV_AUTH = "0"
MIN_PROTOCOL_VERSION = "3"
MUTATIONS_DISABLED = "0"
BLACK_MARKET_ENABLED = "1"
# Friend invasions: LIVE in production since 2026-09-09.
# This var is the ONE launch switch — the client's Invasions surfaces follow it via
# the bootstrap's `pvpEnabled` capability, so flipping it back to "0" and deploying
# this Worker parks the feature with no client redeploy (docs/FRIEND_INVASIONS.md).
# Deploy order still matters for the ruleset handshake: Worker first.
PVP_ENABLED = "1"
# See the staging block above. Production runs the formation defense (roles, stations,
# deployment — docs/PVP_DEFENSE_FORMATION.md) as of the 2026-09-09 launch; "classic" is
# the shipped barn-doorway wave and stays available as the fallback.
PVP_DEFENSE_MODE = "formation"
WRITER_LEASE_MODE = "enforce"
# Endless Mode: LAUNCHED 2026-11-10. Set "0" and deploy to pull it: every /endless/* route
# and the Endless leaderboard then answer 404 and the client hides the Endless card
# (bootstrap `endlessEnabled`). No client release either way.
ENDLESS_ENABLED = "1"
# Server-owned raid cooldown in ms. Omit to use the 2h default (see src/index.ts
# raidCooldownMs). Prod uses the default; local dev sets a small value in .dev.vars.
# RAID_COOLDOWN_MS = "7200000"
# Usage breaker (src/usageBreaker.ts) — the spending cap Cloudflare does not offer.
# Hourly, it estimates this billing cycle's overage for the WHOLE account and checks
# the last hour for a D1 write spike. "observe" only logs (usage_breaker every hour,
# usage_breaker_would_trip as an alert); "enforce" flips service_state to export_only
# (sign-in and farm loading still work, gameplay writes stop) and never reopens.
# Needs the secret:  npx wrangler secret put USAGE_BREAKER_TOKEN --env production
# (an API token with Account Analytics:Read ONLY). Without it the breaker just logs
# usage_breaker_unconfigured. Switch to "enforce" only after the logs look right.
USAGE_BREAKER_MODE = "observe"
USAGE_BREAKER_MONTHLY_USD = "50"
USAGE_BREAKER_HOURLY_ROWS_WRITTEN = "1000000"
USAGE_BREAKER_CYCLE_DAY = "1"
CF_ACCOUNT_ID = "a389a14338b237a5313e5e198220b938"
# There is no save-import path any more: the protocol-v2 seed routes and their
# MIGRATION_CUTOFF_MS gate were removed on 2026-09-03 (the tables went in migration
# 0020). Every account starts from the fixed server defaults in v3/engine.

# Cloudflare's native per-key limiter, one binding per limit (see the staging block
# above for the scheme). Throttling only — the D1 constraints (gift uniqueness,
# grants, save CAS) remain the real correctness controls. These do NOT write to D1.
# RL_60 also carries sign-in at 60/min/IP: it stops token-verification cost
# amplification but tolerates a shared NAT/CGNAT egress. 1001-1003 keep their old
# ids (they were RL_AUTH/RL_WRITE/RL_READ at the same limits).
[[env.production.unsafe.bindings]]
name = "RL_5"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_10"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_20"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_30"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_60"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_120"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_180"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 180, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_300"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# Daily sweep (03:17 UTC) of expired/revoked sessions, stale rate-limit buckets,
# and old pending friend requests — keeps D1 small on the free tier. The hourly one
# (:47) runs the usage breaker. Handler: the `scheduled` export in src/index.ts,
# which tells them apart by the cron string — keep "17 3 * * *" in step with it.
# Mondays 06:07 UTC: the weekly oversight report (OVERSIGHT_REPORT_CRON, same file).
[env.production.triggers]
crons = ["17 3 * * *", "47 * * * *", "7 6 * * 1"]

# Weekly oversight report email (src/oversightReport.ts). Read-only report on Black
# Market abuse signals and bot-like play. To turn the email on:
#   1. npx wrangler email sending enable zombiefarmreforged.com   (adds SPF/DKIM records)
#   2. uncomment the binding below and set the two vars in [env.production.vars]:
#        REPORT_EMAIL_TO = "<owner address>"
#        REPORT_EMAIL_FROM = "reports@zombiefarmreforged.com"
#   3. deploy. Until then the cron runs and only logs oversight_report_unsent.
# [[env.production.send_email]]
# name = "REPORT_EMAIL"
